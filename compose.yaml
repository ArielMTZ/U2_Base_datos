name: RA-U2-AOMG

services:
  web:
    image: nginx:alpine
    container_name: servidor-web-RA-u2
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  tests:
    build: .
    container_name: tests-python-RA-u2
    command: python -m pytest -q
    profiles:
      - test