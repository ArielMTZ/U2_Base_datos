name: Build and deploy Python app to Azure Web App - Actividad-Azure-Deploy

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Preparar carpeta de despliegue
        run: |
          mkdir deploy
          cp app.py deploy/
          cp index.html deploy/
          printf "flask\ngunicorn\n" > deploy/requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_84C04B000DEA45C886B750DB9E5A57BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7B1066BFBC6848E188E02B28FB4FD367 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AABBCA717BFD420A9E9846C2DCF6CFCD }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'Actividad-Azure-Deploy'
          slot-name: 'Production'